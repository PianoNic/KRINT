services:
  db:
    image: postgres:18.3
    container_name: krint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: d4vpas8w0rd13!!!
      POSTGRES_DB: krint
    ports:
      - "57460:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d krint"]
      interval: 2s
      timeout: 3s
      retries: 30

  krint:
    image: ghcr.io/pianonic/krint:latest
    build:
      context: .
      dockerfile: src/KRINT.API/Dockerfile
    container_name: krint
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Optional overrides; the values below already boot a demo stack without one.
    env_file:
      - path: .env
        required: false
    environment:
      Database__Provider: "Postgres"
      ConnectionStrings__KrintDatabase: "Host=db;Port=5432;Database=krint;Username=postgres;Password=d4vpas8w0rd13!!!"
      # No Oidc__Authority: KRINT runs with local password login and seeds this admin account.
      # Its password is generated on first boot and printed once: docker logs krint.
      # Set Oidc__* (see docs/self-host.md) to use your own identity provider instead.
      LocalLogin__AdminUserName: admin
      Cors__AllowedOrigins__0: "http://localhost:56722"
      Krint__PublicUrl: "http://localhost:56722"
      # No Vault__MasterKey here: KRINT generates one on first boot into ./data/vault.key (mounted
      # below). Back that file up. To manage the key yourself, set Vault__MasterKey in .env.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "56722:8080"
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
      - ./backups:/app/backups
      - ./data:/app/data
      - ./krint.yaml:/app/krint.yaml:ro

volumes:
  postgres-data:
